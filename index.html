<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Finde das passende RedPed-Tuningmodul für dein E-Bike.">
    <title>RedPed Motor-Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=28">
  </head>
  <body>
    <main class="finder-shell">
      <nav class="progress" aria-label="Fortschritt">
        <ol id="progress-list"></ol>
      </nav>

      <section class="finder-panel" aria-live="polite">
        <button class="back-button" id="back-button" type="button" hidden>
          <span aria-hidden="true">←</span>
          <span data-i18n="actions.back">Zurück</span>
        </button>

        <div id="finder-content"></div>
      </section>
    </main>

    <dialog class="image-dialog" id="image-dialog">
      <button class="image-dialog-close" type="button" data-dialog-close aria-label="Schließen">×</button>
      <img id="image-dialog-image" src="" alt="">
      <p id="image-dialog-caption"></p>
    </dialog>

    <script src="js/translations.js?v=93"></script>
    <script src="js/motors.js?v=93"></script>
    <script src="js/finder.js?v=101"></script>
  </body>
</html>
